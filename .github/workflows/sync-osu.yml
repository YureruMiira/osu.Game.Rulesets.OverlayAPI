name: Sync osu! versions

on:
  schedule:
    # GitHub may delay scheduled workflows under load. Avoid the busiest exact
    # hour boundary; this is still a nominal 10-minute cadence.
    - cron: '7,17,27,37,47,57 * * * *'
  # An external scheduler may POST the `sync-osu` event for a stricter cadence.
  repository_dispatch:
    types: [sync-osu]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-osu
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      release_targets: ${{ steps.release-targets.outputs.targets }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch latest ppy/osu releases
        id: ppy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          HEADERS="$RUNNER_TEMP/ppy-osu-headers.txt"
          RESPONSE="$(curl --fail --silent --show-error --retry 3 --retry-all-errors \
            --connect-timeout 10 --max-time 60 \
            -D "$HEADERS" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/ppy/osu/releases?per_page=100")"

          # The ppy/osu lookup is one authenticated REST request. At most two
          # additional release-existence checks run later (one per channel),
          # so the normal 10-minute cadence uses no more than 18 REST calls/hour.
          # Log the response quota for audit.
          REMAINING="$(tr -d '\r' < "$HEADERS" | awk -F': ' 'tolower($1) == "x-ratelimit-remaining" { print $2 }' | tail -1)"
          LIMIT="$(tr -d '\r' < "$HEADERS" | awk -F': ' 'tolower($1) == "x-ratelimit-limit" { print $2 }' | tail -1)"
          echo "::notice::GitHub REST rate limit remaining: ${REMAINING:-unknown}/${LIMIT:-unknown}"
          if [ -n "${REMAINING:-}" ] && [ "$REMAINING" -lt 10 ]; then
            echo "::warning::GitHub REST quota is nearly exhausted; the next scheduled run will retry automatically."
          fi

          LAZER="$(jq -r '[.[] | select(.tag_name | endswith("-lazer"))] | max_by(.published_at) | .tag_name // empty' <<< "$RESPONSE")"
          TACHYON="$(jq -r '[.[] | select(.tag_name | endswith("-tachyon"))] | max_by(.published_at) | .tag_name // empty' <<< "$RESPONSE")"
          LAZER_BARE="${LAZER%-lazer}"
          TACHYON_BARE="${TACHYON%-tachyon}"

          [[ "$LAZER_BARE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Could not find a valid lazer release."; exit 1; }
          [[ "$TACHYON_BARE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Could not find a valid tachyon release."; exit 1; }

          # Select the newest stable numeric package that is <= the channel's
          # osu! target. A newer package may target game APIs unavailable in an
          # older client, so it must never be used as a compatibility fallback.
          NUGET_RESPONSE="$(curl --fail --silent --show-error --retry 3 --retry-all-errors \
            --connect-timeout 10 --max-time 60 --location \
            "https://api.nuget.org/v3-flatcontainer/ppy.osu.game/index.json")"
          NUGET_VERSIONS="$(jq -r '.versions[] | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' <<< "$NUGET_RESPONSE" | sort -V)"
          [[ -n "$NUGET_VERSIONS" ]] || {
            echo "::error::NuGet returned no stable numeric ppy.osu.Game versions."
            exit 1
          }

          select_nuget_version() {
            local channel="$1" target="$2" version selected=""
            while IFS= read -r version; do
              [ -z "$version" ] && continue
              if [ "$version" = "$target" ] || [ "$(printf '%s\n%s\n' "$version" "$target" | sort -V | head -1)" = "$version" ]; then
                selected="$version"
              else
                break
              fi
            done <<< "$NUGET_VERSIONS"

            if [ -z "$selected" ]; then
              # The release publisher will build the exact version from the
              # ppy/osu channel tag, so do not fail discovery here.
              echo "::notice::No ppy.osu.Game package <= $target is on nuget.org for $channel; will pack from source." >&2
              return 0
            fi
            if [ "$selected" != "$target" ]; then
              echo "::notice::ppy.osu.Game $target not on nuget.org for $channel; the source-pack fallback will build it." >&2
            fi
            printf '%s' "$selected"
          }

          LAZER_NUGET="$(select_nuget_version lazer "$LAZER_BARE")"
          TACHYON_NUGET="$(select_nuget_version tachyon "$TACHYON_BARE")"

          # ppy/osu never publishes channel tags (-lazer/-tachyon) to nuget.org
          # (deploy.yml excludes `*-*`). When the exact package for a channel's
          # upstream version is absent, build it from the ppy/osu channel tag so
          # the package embeds that tag's CURRENT_RULESET_API_VERSION. The ruleset
          # is compiled against that same API version and therefore matches the
          # channel client exactly. The fallback package version then equals the
          # target version; sync-channel.sh still bumps/commits normally.
          LAZER_PACK_FROM_SOURCE=false
          TACHYON_PACK_FROM_SOURCE=false
          if [ -z "$LAZER_NUGET" ] || [ "$LAZER_NUGET" != "$LAZER_BARE" ]; then
            LAZER_PACK_FROM_SOURCE=true
            LAZER_NUGET="$LAZER_BARE"
            echo "::notice::ppy.osu.Game $LAZER_BARE not on nuget.org for lazer; will pack from ppy/osu tag ${LAZER_BARE}-lazer."
          fi
          if [ -z "$TACHYON_NUGET" ] || [ "$TACHYON_NUGET" != "$TACHYON_BARE" ]; then
            TACHYON_PACK_FROM_SOURCE=true
            TACHYON_NUGET="$TACHYON_BARE"
            echo "::notice::ppy.osu.Game $TACHYON_BARE not on nuget.org for tachyon; will pack from ppy/osu tag ${TACHYON_BARE}-tachyon."
          fi

          echo "lazer_bare=$LAZER_BARE" >> "$GITHUB_OUTPUT"
          echo "tachyon_bare=$TACHYON_BARE" >> "$GITHUB_OUTPUT"
          echo "lazer_nuget=$LAZER_NUGET" >> "$GITHUB_OUTPUT"
          echo "tachyon_nuget=$TACHYON_NUGET" >> "$GITHUB_OUTPUT"
          echo "lazer_pack_from_source=$LAZER_PACK_FROM_SOURCE" >> "$GITHUB_OUTPUT"
          echo "tachyon_pack_from_source=$TACHYON_PACK_FROM_SOURCE" >> "$GITHUB_OUTPUT"
          echo "::notice::ppy/osu lazer latest: $LAZER"
          echo "::notice::ppy/osu tachyon latest: $TACHYON"
          LAZER_SOURCE_LABEL=""
          TACHYON_SOURCE_LABEL=""
          [ "$LAZER_PACK_FROM_SOURCE" = true ] && LAZER_SOURCE_LABEL=" (from source)"
          [ "$TACHYON_PACK_FROM_SOURCE" = true ] && TACHYON_SOURCE_LABEL=" (from source)"
          echo "::notice::Selected ppy.osu.Game for lazer: $LAZER_NUGET$LAZER_SOURCE_LABEL"
          echo "::notice::Selected ppy.osu.Game for tachyon: $TACHYON_NUGET$TACHYON_SOURCE_LABEL"

      - name: Sync lazer channel
        id: lazer
        env:
          GH_TOKEN: ${{ github.token }}
          PACK_FROM_SOURCE: ${{ steps.ppy.outputs.lazer_pack_from_source }}
        run: bash .github/scripts/sync-channel.sh lazer '${{ steps.ppy.outputs.lazer_bare }}' '${{ steps.ppy.outputs.lazer_nuget }}'

      - name: Sync tachyon channel
        id: tachyon
        env:
          GH_TOKEN: ${{ github.token }}
          PACK_FROM_SOURCE: ${{ steps.ppy.outputs.tachyon_pack_from_source }}
        run: bash .github/scripts/sync-channel.sh tachyon '${{ steps.ppy.outputs.tachyon_bare }}' '${{ steps.ppy.outputs.tachyon_nuget }}'

      - name: Collect releases to publish or repair
        id: release-targets
        env:
          LAZER_TAG: ${{ steps.lazer.outputs.release_tag }}
          TACHYON_TAG: ${{ steps.tachyon.outputs.release_tag }}
          LAZER_REPLACE: ${{ steps.lazer.outputs.replace_existing }}
          TACHYON_REPLACE: ${{ steps.tachyon.outputs.replace_existing }}
        run: |
          set -euo pipefail
          TARGETS=()
          if [ -n "$LAZER_TAG" ]; then
            TARGETS+=("$(jq -cn --arg tag "$LAZER_TAG" --arg replace "${LAZER_REPLACE:-false}" \
              '{tag: $tag, replace_existing: ($replace == "true")}')")
          fi
          if [ -n "$TACHYON_TAG" ]; then
            TARGETS+=("$(jq -cn --arg tag "$TACHYON_TAG" --arg replace "${TACHYON_REPLACE:-false}" \
              '{tag: $tag, replace_existing: ($replace == "true")}')")
          fi

          if [ "${#TARGETS[@]}" -eq 0 ]; then
            echo 'targets=[]' >> "$GITHUB_OUTPUT"
          else
            printf 'targets=%s\n' "$(printf '%s\n' "${TARGETS[@]}" | jq -sc .)" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: sync
    if: needs.sync.outputs.release_targets != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.sync.outputs.release_targets) }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.tag }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Fetch release tooling from main
        run: git fetch origin main:refs/remotes/origin/main

      - name: Build and publish ${{ matrix.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
          PACK_OSU_FROM_SOURCE_SCRIPT: ${{ runner.temp }}/pack-osu-from-source.sh
          VERIFY_MERGED_ASSEMBLY_SCRIPT: ${{ runner.temp }}/verify-merged-assembly.ps1
          REPLACE_EXISTING: ${{ matrix.replace_existing }}
        run: |
          git show origin/main:.github/scripts/pack-osu-from-source.sh > "$PACK_OSU_FROM_SOURCE_SCRIPT"
          git show origin/main:.github/scripts/verify-merged-assembly.ps1 > "$VERIFY_MERGED_ASSEMBLY_SCRIPT"
          bash <(git show origin/main:.github/scripts/release-tag.sh) '${{ matrix.tag }}'
